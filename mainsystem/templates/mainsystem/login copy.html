{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>লগইন করুন</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet"> 
 
  <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
  <style>
    body {
      font-family: 'SolaimanLipi', sans-serif;
      background-color: #f8f9fa;
    }
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo img {
      max-width: 200px;
    }
    .form-label {
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo">
    <img src="{% static 'images/d&h_soft_logo_gif.gif' %}" alt="Logo">
    <br>
    <hr>
    <h5>D&H Soft @ 2025</h5>
  </div>

  <h4 class="text-center mb-4">লগইন করুন</h4>

  {% if error %}
    <div class="alert alert-danger text-center">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="username" class="form-label">ইউজারনেম</label>
      <input type="text" name="username" id="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">পাসওয়ার্ড</label>
      <input type="password" name="password" id="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">লগইন</button>
  </form>

  <div class="text-center mt-3">
    <small>পাসওয়ার্ড ভুলে গেছেন? <a href="#">পুনরুদ্ধার করুন</a></small>
  </div>
</div>

</body>
</html>
