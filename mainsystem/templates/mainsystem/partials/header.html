{% load static %}
<header class="top-nav d-flex justify-content-between align-items-center shadow-sm">
    <div class="d-flex align-items-center">
        <button class="btn btn-light me-3" id="sidebarToggle">
            <i class="bi bi-list fs-4"></i>
        </button>
        
        <div class="d-flex align-items-center gap-2 branding-logo-top">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
                <defs>
                    <linearGradient id="topNavPunchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#0dcaf0" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="45" fill="none" stroke="url(#topNavPunchGrad)" stroke-width="4" stroke-dasharray="6 3" />
                <circle cx="50" cy="50" r="38" fill="#ffffff" />
                <line x1="50" y1="50" x2="50" y2="26" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" />
                <line x1="50" y1="50" x2="66" y2="50" stroke="#0dcaf0" stroke-width="5" stroke-linecap="round" />
                <circle cx="50" cy="50" r="5" fill="#198754" />
            </svg>
            <h5 class="mb-0 fw-bold text-dark tracking-tight d-none d-sm-block">
                Punch<span class="text-primary">Time</span> 
                <small class="fs-6 text-muted fw-normal d-none d-lg-inline-block">| Roster & Attendance Management</small>
            </h5>
        </div>
    </div>
    
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-light position-relative rounded-circle p-2">
            <i class="bi bi-bell fs-5 text-secondary"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 10px;">
                3
            </span>
        </button>

        <button class="btn btn-sm btn-light rounded-circle p-2">
            <i class="bi bi-gear fs-5 text-secondary"></i>
        </button>

        <div class="dropdown">
            <a class="d-flex align-items-center text-decoration-none dropdown-toggle gap-2" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                {% if user_profile_image %}
                    <img src="{{ user_profile_image }}" class="rounded-circle border" width="36" height="36">
                {% else %}
                    <img src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=3b82f6&color=fff" class="rounded-circle border" width="36" height="36">
                {% endif %}
                <div class="text-end d-none d-md-block me-1">
                    <p class="small mb-0 fw-bold text-dark lh-1" style="font-size: 13px;">{{ request.user.username }}</p>
                    <span class="badge bg-success-subtle text-success mt-1" style="font-size: 9px; padding: 2px 6px;">{{ user_role }}</span>
                </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2" style="border-radius: 10px;">
                {% if request.user.id %}
                <li>
                    <a href="" class="dropdown-item py-2">
                        <i class="bi bi-person me-2 text-primary"></i> আমার প্রোফাইল
                    </a>
                </li>
                <li>
                    <a href="#" class="dropdown-item py-2" id="passwordResetBtn">
                        <i class="bi bi-shield-lock me-2 text-warning"></i> পাসওয়ার্ড পরিবর্তন
                    </a>
                </li>
                <li><hr class="dropdown-divider opacity-50"></li>
                {% endif %}
                <li>
                    <form id="headerLogoutForm" action="{% url 'logout' %}" method="post" class="d-none">
                        {% csrf_token %}
                    </form>
                    <a class="dropdown-item text-danger py-2" href="#" onclick="document.getElementById('headerLogoutForm').submit(); return false;">
                        <i class="bi bi-box-arrow-right me-2"></i> 🚪 লগআউট
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>
