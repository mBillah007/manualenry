<!-- templates/mainsystem/report_popup.html -->
<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}Patient Report{% endblock %}</title>
  <style>
    @page {
      size: A4;
      margin: 20mm;
    }
    body {
      font-family: Arial, sans-serif;
      font-size: 12pt;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
    }
    .page {
      width: 210mm;
      min-height: 297mm;
      padding: 20mm;
      margin: auto;
      background: white;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .print-btn {
      margin: 10px;
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #333;
    }
    th, td {
      padding: 8px;
      text-align: left;
    }
    h5 {
      border-left: 4px solid #0d6efd;
      padding-left: 10px;
    }
    @media print {
      .print-btn {
        display: none !important;
      }
      body {
        background: white;
      }
      .page {
        box-shadow: none;
        margin: 0;
        padding: 0;
      }
    }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
