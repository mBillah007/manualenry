<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <form id="userForm">
                {% csrf_token %}
                <div class="modal-header bg-dark text-white p-4 rounded-top-4">
                    <h5 class="modal-title fw-bold" id="modalTitle">➕ Add System User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <div class="card border-0 shadow-sm rounded-3 p-3 mb-3">
                        <label class="fw-bold text-primary small mb-3 text-uppercase">Account Information</label>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Username</label>
                                <input type="text" name="username" id="m_username" class="form-control bg-white rounded-3" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Email Address</label>
                                <input type="email" name="email" id="m_email" class="form-control bg-white rounded-3" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Assign Department</label>
                                <select name="department" id="m_dept" class="form-select bg-white rounded-3">
                                    <option value="">Select Department</option>
                                    {% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">System Role</label>
                                <select name="role" id="m_role" class="form-select bg-white rounded-3" required>
                                    <option value="">Select Role</option>
                                    {% for r in roles %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="passwordFieldGroup" class="card border-0 shadow-sm rounded-3 p-3 mb-3 animate__animated animate__fadeIn">
                        <label class="fw-bold text-primary small mb-3 text-uppercase">Security Credentials</label>
                        <div class="row g-3">
                            <div class="col-md-6"><input type="password" name="password" class="form-control" placeholder="Password"></div>
                            <div class="col-md-6"><input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password"></div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-3 p-3">
                        <div class="d-flex flex-wrap gap-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_active" id="m_active" checked>
                                <label class="form-check-label small fw-semibold">Active</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_staff" id="m_staff">
                                <label class="form-check-label small fw-semibold">Staff Access</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_protected" id="m_protected">
                                <label class="form-check-label small fw-semibold text-danger">Protected</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-5 shadow fw-bold">Save Record</button>
                </div>
            </form>
        </div>
    </div>
</div>
