<div class="modal fade" id="moduleModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <form id="moduleForm" class="modal-content" method="post">
      {% csrf_token %}
      <div class="modal-header">
        <h5 class="modal-title" id="moduleModalLabel">মডিউল</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body row g-3">
        <input type="hidden" id="moduleId" name="id">
        <div class="col-md-6">
          <label>নাম</label>
          <input type="text" id="moduleName" name="name" class="form-control">
        </div>
        <div class="col-md-6">
          <label>লেবেল</label>
          <input type="text" id="moduleLabel" name="label" class="form-control">
        </div>
        <div class="col-md-6">
          <label>URL Name</label>
          <input type="text" id="moduleUrl" name="url_name" class="form-control">
        </div>
        <div class="col-md-6">
          <label>আইকন ক্লাস</label>
          <div class="input-group">
            <input type="text" class="form-control" id="moduleIcon" name="icon" placeholder="bi bi-circle">
            <button type="button" class="btn btn-outline-secondary" id="openIconPicker">🎨</button>
          </div>
          <div class="mt-2">
            <i id="iconPreview" class="fs-4 text-primary"></i>
          </div>
        </div>
        <div class="col-md-6">
          <label>ক্রম</label>
          <input type="number" id="moduleOrder" name="order" class="form-control">
        </div>
        <div class="col-md-6">
          <label>Parent</label>
          <select id="moduleParent" name="parent" class="form-select">
            <option value="">-- নেই --</option>
            {% for m in modules %}
              <option value="{{ m.id }}">{{ m.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label>গ্রুপ</label>
          <select id="moduleGroup" name="group" class="form-select">
            <option value="">-- গ্রুপ নির্বাচন করুন --</option>
            {% for g in module_groups %}
              <option value="{{ g.id }}">{{ g.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6 form-check mt-3">
          <input type="checkbox" id="moduleVisible" name="is_visible" class="form-check-input">
          <label class="form-check-label">দৃশ্যমান</label>
        </div>
        <div class="col-md-6 form-check mt-3">
          <input type="checkbox" id="moduleHeader" name="is_header" class="form-check-input">
          <label class="form-check-label">Header হিসেবে দেখাও</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">💾 সংরক্ষণ করুন</button>
      </div>
    </form>
  </div>
</div>
