<!-- 🔐 Password Modal -->
<div class="modal fade" id="passwordUpdateModal" tabindex="-1" aria-labelledby="passwordUpdateModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="passwordForm" method="POST" data-user-id="{{ request.user.id }}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="passwordUpdateModalLabel">🔐 পাসওয়ার্ড পরিবর্তন</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3 position-relative">
            <label class="form-label" for="newPasswordInput">নতুন পাসওয়ার্ড</label>
            <input type="password" name="new_password" class="form-control" required minlength="6" id="newPasswordInput" autocomplete="new-password">
            <div class="invalid-feedback"></div>
            <button type="button" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2" id="toggleNewPassword" aria-label="Show/hide password">
              👁️
            </button>
          </div>
          <div class="mb-3 position-relative">
            <label class="form-label" for="confirmPasswordInput">পুনরায় দিন</label>
            <input type="password" name="confirm_password" class="form-control" required id="confirmPasswordInput" autocomplete="new-password">
            <div class="invalid-feedback"></div>
            <button type="button" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2" id="toggleConfirmPassword" aria-label="Show/hide password">
              👁️
            </button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success" id="confirmPasswordBtn">💾 সংরক্ষণ করুন</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">❌ বাতিল</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ✅ Toast Container -->
<div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055"></div>

<!-- ✅ Confirm Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">⚠️ নিশ্চিত করুন</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        আপনি কি নিশ্চিতভাবে পাসওয়ার্ড পরিবর্তন করতে চান?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="finalSubmitBtn">✅ হ্যাঁ, পরিবর্তন করুন</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">❌ না</button>
      </div>
    </div>
  </div>
</div>
